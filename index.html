
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f2f57">
<link rel="manifest" href="manifest.json">
<title>Radio L'ecole</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #0f2f57;
  color: white;
}

/* PANTALLA DE BIENVENIDA */

#inicio {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #0f2f57;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  z-index: 1000;
  padding: 20px;
}

.logo-inicio {
  width: 170px;
  max-width: 70%;
  margin-bottom: 20px;
}

#inicio button {
  margin-top: 20px;
  padding: 12px 25px;
  font-size: 16px;
}

/* ENCABEZADO */

header {
  text-align: center;
  padding: 30px 20px 20px;
}

.logo {
  width: 120px;
  max-width: 70%;
}

header h1 {
  margin: 15px 0 10px;
}

header p {
  margin: 8px 0;
}

.temporada {
  font-weight: bold;
  letter-spacing: 1px;
}

/* BOTONES */

button {
  background: #1db954;
  color: white;
  border: none;
  padding: 9px 17px;
  border-radius: 20px;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #17a64a;
}

#instalarApp {
  display: none;
  margin-top: 10px;
}

/* CUADRÍCULA DE EPISODIOS */

.container {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  padding: 20px 20px 140px;
  display: grid;
  grid-template-columns: repeat(auto-fit, 240px);
  justify-content: center;
  align-items: stretch;
  gap: 25px;
}

/* TODAS LAS TARJETAS DEL MISMO TAMAÑO */

.card {
  width: 240px;
  height: 270px;
  display: flex;
  flex-direction: column;
  background: white;
  color: #333;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  transition: transform 0.25s;
}

.card:hover {
  transform: translateY(-5px);
}

/* PORTADAS UNIFORMES */

.card img {
  display: block;
  width: 100%;
  height: 150px;
  min-height: 150px;
  object-fit: cover;
  object-position: center;
  flex-shrink: 0;
  background: #e8edf3;
}

/* INFORMACIÓN Y BOTONES ALINEADOS */

.info {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 12px 15px;
}

.titulo {
  height: 60px;
  overflow: hidden;
  font-weight: bold;
  font-size: 14px;
  line-height: 1.4;
  margin-bottom: 5px;
}

.info button {
  align-self: flex-start;
  margin-top: auto;
  flex-shrink: 0;
}

/* REPRODUCTOR FIJO */

.player {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #081f3c;
  padding: 12px;
  text-align: center;
  box-shadow: 0 -3px 15px rgba(0,0,0,0.4);
  z-index: 100;
}

audio {
  display: block;
  width: 95%;
  max-width: 650px;
  margin: 0 auto;
}

/* ADAPTACIÓN PARA CELULARES */

@media (max-width: 600px) {
  .logo {
    width: 90px;
  }

  .container {
    grid-template-columns: 240px;
    justify-content: center;
    padding: 15px 15px 130px;
  }

  .card {
    width: 240px;
  }

  header {
    padding-top: 25px;
  }
}
</style>
</head>

<body>

<!-- PANTALLA DE BIENVENIDA -->

<div id="inicio">
  <img src="./logo.png" class="logo-inicio" alt="Radio L'ecole">
  <h1>Radio L'ecole</h1>
  <p>Nueva temporada, nuevas voces e historias.</p>
  <button onclick="entrar()">Entrar a la radio</button>
</div>

<!-- ENCABEZADO -->

<header>
  <img src="./logo.png" class="logo" alt="Radio L'ecole">
  <h1>Radio L'ecole</h1>
  <p class="temporada">NUEVA TEMPORADA</p>
  <p>Nuevos locutores, nuevas historias y nuevas voces.</p>
  <button id="instalarApp">Instalar app 📱</button>
</header>

<!-- EPISODIOS -->

<div class="container">

  <!-- TEMPORADA 1 - EPISODIO 1 -->

  <div class="card">
    <img src="./portada1.jpg?v=2" alt="Especial de Halloween">
    <div class="info">
      <div class="titulo">
        Temporada 1 · Episodio 1: Especial de Halloween
      </div>
      <button onclick="playEpisode('episodio1.mp3')">
        Escuchar
      </button>
    </div>
  </div>

  <!-- TEMPORADA 1 - EPISODIO 2 -->

  <div class="card">
    <img src="./portada2.png?v=1" alt="Especial de Día de Muertos">
    <div class="info">
      <div class="titulo">
        Temporada 1 · Episodio 2: Especial de Día de Muertos
      </div>
      <button onclick="playEpisode('episodio2.mp3')">
        Escuchar
      </button>
    </div>
  </div>

</div>

<!-- REPRODUCTOR -->

<div class="player">
  <audio id="audioPlayer" controls preload="none"></audio>
</div>

<script>

/* ENTRAR A LA RADIO */

function entrar() {
  document.getElementById("inicio").style.display = "none";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

/* REPRODUCIR EPISODIOS */

function playEpisode(file) {
  const player = document.getElementById("audioPlayer");

  player.pause();
  player.src = "./" + file + "?v=" + Date.now();
  player.load();

  player.play().catch(function(error) {
    console.error("Error al reproducir:", error);

    alert("No se pudo reproducir el episodio. Comprueba que el archivo MP3 esté publicado en GitHub y que su nombre coincida exactamente.");
  });

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });
}

/* INSTALAR APLICACIÓN */

let deferredPrompt;

window.addEventListener("beforeinstallprompt", function(e) {
  e.preventDefault();
  deferredPrompt = e;

  document.getElementById("instalarApp").style.display = "inline-block";
});

document.getElementById("instalarApp").addEventListener("click", async function() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;

    deferredPrompt = null;

    document.getElementById("instalarApp").style.display = "none";
  }
});

</script>

</body>
</html>
