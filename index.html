
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f2f57">
<link rel="manifest" href="manifest.json">
<title>Radio L'ecole</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #0f2f57;
  color: white;
}

#inicio {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #0f2f57;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  z-index: 1000;
  padding: 20px;
}

.logo-inicio {
  width: 170px;
  max-width: 70%;
  margin-bottom: 20px;
}

#inicio button {
  margin-top: 20px;
  padding: 12px 25px;
  font-size: 16px;
}

header {
  text-align: center;
  padding: 30px 20px 20px;
}

.logo {
  width: 120px;
  max-width: 70%;
}

header h1 {
  margin: 15px 0 10px;
}

header p {
  margin: 8px 0;
}

.temporada {
  font-weight: bold;
  letter-spacing: 1px;
}

button {
  background: #1db954;
  color: white;
  border: none;
  padding: 9px 17px;
  border-radius: 20px;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #17a64a;
}

#instalarApp {
  display: none;
  margin-top: 10px;
}

.container {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  padding: 20px 20px 140px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 240px));
  justify-content: center;
  align-items: start;
  gap: 25px;
}

.card {
  width: 100%;
  min-width: 0;
  background: white;
  color: #333;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  transition: transform 0.25s;
}

.card:hover {
  transform: translateY(-5px);
}

.card img {
  display: block;
  width: 100%;
  height: 150px;
  object-fit: cover;
  object-position: center;
  background: #0f2f57;
}

.info {
  padding: 15px;
}

.titulo {
  font-weight: bold;
  margin-bottom: 10px;
  font-size: 15px;
  line-height: 1.4;
}

.player {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #081f3c;
  padding: 12px;
  text-align: center;
  box-shadow: 0 -3px 15px rgba(0,0,0,0.4);
  z-index: 100;
}

audio {
  display: block;
  width: 95%;
  max-width: 650px;
  margin: 0 auto;
}

@media (max-width: 600px) {
  .logo {
    width: 90px;
  }

  .container {
    grid-template-columns: minmax(0, 1fr);
    padding: 15px 20px 130px;
  }

  header {
    padding-top: 25px;
  }
}
</style>
</head>

<body>

<div id="inicio">
  <img src="./logo.png" class="logo-inicio" alt="Radio L'ecole">
  <h1>Radio L'ecole</h1>
  <p>Nueva temporada, nuevas voces e historias.</p>
  <button onclick="entrar()">Entrar a la radio</button>
</div>

<header>
  <img src="./logo.png" class="logo" alt="Radio L'ecole">
  <h1>Radio L'ecole</h1>
  <p class="temporada">NUEVA TEMPORADA</p>
  <p>Nuevos locutores, nuevas historias y nuevas voces.</p>
  <button id="instalarApp">Instalar app 📱</button>
</header>

<div class="container">

  <div class="card">
    <img
      src="./portada1.jpg?v=2"
      alt="Especial de Halloween"
      onerror="this.alt='No se pudo cargar la portada'; this.style.visibility='hidden';"
    >
    <div class="info">
      <div class="titulo">Temporada 1 · Episodio 1: Especial de Halloween</div>
      <button onclick="playEpisode('episodio1.mp3')">Escuchar</button>
    </div>
  </div>

</div>

<div class="player">
  <audio id="audioPlayer" controls preload="none"></audio>
</div>

<script>
function entrar() {
  document.getElementById("inicio").style.display = "none";
}

function playEpisode(file) {
  const player = document.getElementById("audioPlayer");

  player.pause();
  player.src = "./" + file + "?v=" + Date.now();
  player.load();

  player.play().catch(function(error) {
    console.error("Error al reproducir el audio:", error);
    alert("No se pudo reproducir el episodio. Comprueba que episodio1.mp3 esté publicado en GitHub.");
  });
}

let deferredPrompt;

window.addEventListener("beforeinstallprompt", function(e) {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("instalarApp").style.display = "inline-block";
});

document.getElementById("instalarApp").addEventListener("click", async function() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById("instalarApp").style.display = "none";
  }
});
</script>

</body>
</html>
