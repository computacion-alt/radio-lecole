<title>Radio L'ecole | Nueva Temporada</title>

<style>
body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#0f2f57;
color:white;
}

#inicio{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#0f2f57;

flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
z-index:1000;
}

.logo-inicio{
width:170px;
max-width:70%;
margin-bottom:20px;
}

#inicio button{
background:#1db954;

}

header{

}

.logo{

#instalarApp{

cursor:pointer;
font-weight:bold;
}

.container{
max-width:1100px;
margin:auto;

padding-bottom:150px;

grid-template-columns:repeat(auto-fit,minmax(240px,1fr));

font-weight:bold;
}

background:#17a64a;
}

position:fixed;

background:#081f3c;

text-align:center;
box-shadow:0 -3px 15px rgba(0,0,0,0.4);
}

audio{
width:95%;
max-width:650px;
}

@media (max-width:600px){
.logo{width:90px;}

}
</style>
</head>

<body>

<div id="inicio">
<img src="logo.png" class="logo-inicio" alt="Radio L'ecole">
<h1>Radio L'ecole</h1>
<p>Nueva temporada · Nuevas voces, nuevas historias</p>
<button onclick="entrar()">Entrar a la radio</button>
</div>

<header>
<img src="logo.png" class="logo" alt="Radio L'ecole">
<h1>Radio L'ecole</h1>
<p><strong>NUEVA TEMPORADA</strong></p>
<p>Nuevos locutores, nuevas historias y nuevas voces.</p>
<button id="instalarApp">Instalar app 📱</button>
</header>

<div class="container">

<div class="card">
<img src="portada1.jpg" alt="Portada del episodio 1">
<div class="info">
<div class="titulo">Temporada 1 · Episodio 1</div>
<button onclick="playEpisode('episodio1.mp3')">Escuchar</button>
</div>
</div>

</div>

<div class="player">
<audio id="audioPlayer" controls preload="none"></audio>
</div>

<script>
function playEpisode(file){
var player=document.getElementById("audioPlayer");

player.pause();
player.src=file+"?v="+Date.now();
player.load();

player.play().catch(function(error){
console.log("No se pudo reproducir el episodio:",error);
alert("No se pudo reproducir el audio. Revisa que el archivo exista y que su nombre coincida exactamente.");
});

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});
}

function entrar(){
document.getElementById("inicio").style.display="none";
}

let deferredPrompt;

window.addEventListener("beforeinstallprompt",function(e){
e.preventDefault();
deferredPrompt=e;
document.getElementById("instalarApp").style.display="inline-block";
});

document.getElementById("instalarApp").addEventListener("click",async function(){
if(deferredPrompt){
deferredPrompt.prompt();
await deferredPrompt.userChoice;
deferredPrompt=null;
document.getElementById("instalarApp").style.display="none";
}
});
</script>

</body>
</html>
